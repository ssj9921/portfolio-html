<!doctype html>
<html lang="ko">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; img-src 'none'; font-src 'none'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><meta name="referrer" content="no-referrer">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline · Template</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#252d29;font-family:Arial,"Malgun Gothic",sans-serif;padding:26px}.wrap{max-width:820px;margin:auto}.label{font-size:10px;letter-spacing:.15em;color:#345745}h1{font:normal 32px Georgia,"Batang",serif;margin:16px 0 28px}.timeline{border-left:1px solid #c6d1c0;margin-left:12px;padding-left:25px}.event{position:relative;margin-bottom:22px}.event:before{content:"";position:absolute;left:-31px;top:20px;width:10px;height:10px;border-radius:50%;background:#345745;border:2px solid #f4f3ed}
summary{list-style:none;min-height:52px;background:#fafbf7;border:1px solid #d7ddd3;padding:16px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:13px}summary::-webkit-details-marker{display:none}summary:after{content:"+";color:#345745;font:20px Georgia,serif}.event[open]>summary:after{content:"−"}.detail{border:1px solid #d7ddd3;border-top:0;padding:18px;background:#e6ecdf;font-size:12px;color:#4e5b4e;line-height:1.8;word-break:keep-all}summary:focus-visible{outline:3px solid #345745;outline-offset:3px}
@media(max-width:450px){body{padding:20px}h1{font-size:27px}.timeline{padding-left:20px}.event:before{left:-26px}}
</style>
</head>
<body>
<main class="wrap"><div class="label">PROCESS / DECISION TIMELINE</div><h1>과정을 따라, 선택을 읽다.</h1>
<div class="timeline">
<details class="event" open><summary>01 · 문제와 출발점</summary><div class="detail">프로젝트를 시작한 배경, 처음 세운 목표와 제약을 기록합니다.</div></details>
<details class="event"><summary>02 · 선택과 변화</summary><div class="detail">문제, 검토한 대안, 선택의 근거와 결과를 원본 기록과 연결합니다.</div></details>
<details class="event"><summary>03 · 검증과 다음 행동</summary><div class="detail">확인한 결과와 남은 한계를 구분하고, 다음에 적용할 행동을 정리합니다.</div></details>
</div>
</main>
</body>
</html>
