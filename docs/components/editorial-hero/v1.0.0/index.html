</style></head><body><div class="wrap"><header class="mast"><div class="brand"><span class="mark" aria-hidden="true"></span>SELECTED WORK</div><span class="edition">A PORTFOLIO IN PROGRESS</span></header><section class="hero" aria-label="포트폴리오 소개"><div><div class="eyebrow">Ideas into experiences</div><h1>문제를 발견하고,<br><em>경험으로 풀어내다.</em></h1><p class="description">결과물과 그 뒤의 선택을 함께 기록합니다.<br>하나의 프로젝트를 두 가지 관점으로 읽는 공간.</p><div class="tags"><span class="tag">PRODUCT</span><span class="tag">RETROSPECTIVE</span></div></div><div class="art" aria-hidden="true"><div class="grid"></div><div class="sheet second"></div><div class="sheet first"><span class="tiny">Notes, made tangible.</span><div class="shape"></div><div class="rule"></div><div class="rule"></div><div class="rule short"></div></div><span class="art-note">from a question to a possibility</span></div></section><div class="hero-bottom"><span><i class="dot"></i>THOUGHTFUL WORK, DOCUMENTED.</span><span>PRODUCT × PROCESS</span></div></div></body></html>
